{% extends 'base.html' %}

{% block content %}
<div class="flex max-w-lg flex-col gap-5">
    <div class="flex flex-col gap-1.5">
        <a href="{% url 'students:list' %}"
           class="inline-flex items-center gap-1.5 self-start text-sm text-slate-600 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 dark:text-slate-400 dark:hover:text-slate-100 dark:focus-visible:ring-slate-300 dark:focus-visible:ring-offset-slate-950">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            All students
        </a>
        <h2 class="text-2xl font-semibold tracking-tight">Edit {{ student.full_name }}</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400">Record #{{ student.pk }} · {{ student.get_course_display }}</p>
    </div>
    {% include '_student_form.html' with submit_label="Save changes" %}
</div>
{% endblock %}
