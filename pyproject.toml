[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "students"]

[tool.coverage.run]
source = ["students", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
